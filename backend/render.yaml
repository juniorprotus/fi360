# Render Free Tier Deployment Configuration
# Documentation: https://render.com/docs/yaml-spec
# This file defines the FI360 backend as a Render Web Service.
# Set environment variables in the Render dashboard after initial deploy.

services:
  - type: web
    name: fi360-backend
    env: node
    region: oregon   # Closest to most Atlas M0 free regions
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true  # Auto-deploy on push to main

    # Environment Variables
    # =====================
    # Set these in Render Dashboard > fi360-backend > Environment
    # DO NOT set MONGODB_URI here (security risk). Use Render's Secret Files feature.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000        # Render assigns PORT automatically; this is the default
      - key: FRONTEND_URL
        value: https://fi360.vercel.app   # Update with your actual Vercel URL after deploy

      # Secrets — Add these manually in Render Dashboard:
      # - key: MONGODB_URI
      #   value: mongodb+srv://...
      # - key: GEMINI_API_KEY
      #   value: your-key
